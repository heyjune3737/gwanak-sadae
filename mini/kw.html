<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관중의 제왕</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@900&display=swap">
<style>
/* 레이아웃: 한 화면 게임 — 위 머리줄(남은 판·최고), 가운데 활터(탭해서 쏘기), 아래 오늘 기록·랭킹 */
:root{
  --bg:#EEF1F4; --card:#FFFFFF; --fg:#1B2433; --mut:#5D6878; --line:#D5DBE3; --chip:#E4E9EF;
  --navy:#1F3A5F; --red:#D2402F; --gold:#C99A2E;
  --fd:"Do Hyeon","Noto Sans KR",sans-serif; --fb:"Noto Sans KR",system-ui,sans-serif; --fs:"Noto Serif KR",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161E; --card:#1A212C; --fg:#E8EDF3; --mut:#9AA6B6; --line:#2C3644; --chip:#252E3B;
  --navy:#8FB4E0; --red:#F06A57; --gold:#E7BE5A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161E; --card:#1A212C; --fg:#E8EDF3; --mut:#9AA6B6; --line:#2C3644; --chip:#252E3B;
  --navy:#8FB4E0; --red:#F06A57; --gold:#E7BE5A; color-scheme:dark }
body{background:var(--bg);color:var(--fg);font-family:var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:var(--fd);font-weight:400;font-size:26px;margin:0;color:var(--navy)}
h1 small{font-family:var(--fb);font-size:12px;color:var(--mut);margin-left:6px}
select{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:4px 6px}
.field{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#9CC6E6;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}
canvas{display:block;width:100%;height:min(62vh,520px);min-height:380px}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(15,25,40,.55);color:#fff;text-align:center;padding:20px}
.over[hidden]{display:none}
.snd{position:absolute;right:10px;bottom:10px;z-index:3;width:40px;height:40px;border-radius:50%;border:2px solid #1B2433;background:rgba(255,255,255,.92);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.snd.off{background:#D5DBE3}
.snd:focus-visible{outline:3px solid #FFD66B;outline-offset:2px}
.over h2{font-family:var(--fd);font-weight:400;font-size:30px;margin:0}
.over .n{font-family:var(--fs);font-size:52px;line-height:1;color:#FFD66B}
.over p{margin:0;font-size:14px;line-height:1.6;opacity:.95}
.over button{border:0;border-radius:14px;padding:14px 26px;font-family:var(--fd);font-size:22px;background:#D2402F;color:#fff;cursor:pointer}
.over button:disabled{background:#5D6878;cursor:default}
.over button:focus-visible{outline:3px solid #FFD66B;outline-offset:2px}
.tip{font-size:13px;color:var(--mut);line-height:1.6;margin:0}
.tip b{color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card h2{font-family:var(--fd);font-weight:400;font-size:19px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 span{font-family:var(--fb);font-size:12px;color:var(--mut)}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.games div{border:1px dashed var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--mut)}
.games div b{display:block;font-family:var(--fd);font-weight:400;font-size:20px;color:var(--fg)}
.games .sum{grid-column:1/-1;border:2px solid var(--gold);color:var(--fg);font-size:14px;font-weight:700}
.games .sum b{display:inline;font-size:20px;color:var(--gold)}
.games .sum.done{background:color-mix(in srgb,var(--gold) 15%,transparent)}
.rank{display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.rk{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:6px 4px;border-radius:8px;font-size:14px}
.rk b{font-family:var(--fd);font-weight:400;font-size:17px}
.rk .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rk .n small{color:var(--mut)}
.rk.me{background:color-mix(in srgb,var(--gold) 20%,transparent)}
.rk:nth-child(1) b{color:var(--gold)} .rk:nth-child(2) b{color:#8C99A8} .rk:nth-child(3) b{color:#B7764A}
.ex{font-size:11px;color:var(--mut)}
.dev{font-size:12px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dev button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
/* 사대지기 + 규칙 칸 */
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.rules div{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.35;min-width:0}
.rules div i{font-style:normal;font-size:18px;flex:none}
.rules div b{color:var(--fg)}
.rules div span{color:var(--mut)}
.keeper{display:flex;gap:10px;align-items:flex-end}
.keeper .av{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:3px}
.keeper .av img{width:64px;height:77px;object-fit:contain;display:block}
.keeper .av b{font-size:10.5px;background:var(--gold);color:#2A2233;padding:1px 6px;border-radius:4px;white-space:nowrap}
.keeper .bub{position:relative;flex:1;min-width:0;background:var(--card);border:2px solid var(--fg);border-radius:12px;padding:10px 12px;margin-bottom:18px;font-size:13px;line-height:1.6;color:var(--fg);word-break:keep-all}
.keeper .bub::before{content:"";position:absolute;left:-8px;bottom:14px;width:12px;height:12px;background:var(--card);border-left:2px solid var(--fg);border-bottom:2px solid var(--fg);transform:rotate(45deg)}
.keeper .kind{display:inline-block;font-size:11px;background:var(--chip);color:var(--mut);border-radius:999px;padding:1px 8px;margin-bottom:4px}
.keeper .hj{font-family:var(--fs);font-size:20px;line-height:1.3}
.keeper .rd{font-size:12px;color:var(--mut)}
.keeper .src{font-size:11px;color:var(--mut);text-align:right;margin-top:4px}
.over .keeper{max-width:330px;text-align:left}
.over .keeper .bub{color:#1B2433;background:#FFFFFF;border-color:#FFFFFF}
.over .keeper .bub::before{background:#FFFFFF;border-color:#FFFFFF}
#wordCard[hidden],#setCard[hidden]{display:none}
.keeper .nag{font-weight:700;margin-bottom:4px}
.keeper .nag2{margin-top:6px;font-weight:700;color:var(--red)}
.over .keeper .nag2{color:#D2402F}


.mode{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--fg)}
.mode.rk{background:var(--gold);color:#2A2233}
</style>

<div class="wrap">
  <div class="top">
    <h1>🎯 관중의 제왕</h1>
    <span class="ex mode" id="modeTag"></span>
  </div>

  <div class="field" id="field">
    <canvas id="cv"></canvas>
    <button type="button" class="snd" id="snd" aria-label="소리 끄기">🔊</button>
    <div class="over" id="over"></div>
  </div>

  <div id="wordCard" hidden></div>
  <div class="rules" aria-label="규칙">
    <div><i>👆</i><span><b>톡</b> 누르면 바로 발시</span></div>
    <div><i>🎯</i><span>과녁 <b>올 자리</b>에 미리</span></div>
    <div><i>🏹</i><span>화살 <b>3개</b>가 목숨</span></div>
    <div><i>⏱</i><span>한 발은 <b>8초</b> 안에</span></div>
    <div><i>🔴</i><span><b>홍심</b> 맞히면 화살 +1</span></div>
    <div><i>🎁</i><span><b>화살통</b> +1 · <b>벌집</b>은 끝</span></div>
  </div>
  <p class="tip">한 판 <b>15시</b> · 하루 3판 <b>45시</b> 합계로 단 (24중 초단 ~ 40중 9단) · 한 순 5발 모두 관중이면 <b>몰기</b></p>

  <div class="card" id="setCard">
    <h2>오늘의 세 판 <span id="date"></span></h2>
    <div class="games" id="games"></div>
  </div>

</div>

<script>
(()=>{
const BR=(()=>{ try{ return (parent!==window && parent.MINI_BR) || null; }catch(e){ return null; } })();
try{ const th=parent.document.documentElement.dataset.theme; if(BR && th) document.documentElement.dataset.theme=th; }catch(e){}
const PRAC=!!(BR && BR.mode==='practice');
if(BR){ const tp=document.querySelector('.top'); if(tp) tp.style.display='none'; }   // 앱 위 막대에 이름·모드가 이미 있음
const CH={cat:'__cat__',dog:'__dog__',bear:'__bear__',duck:'__duck__'};
const $=s=>document.querySelector(s);
let MUTE=false; try{ MUTE=localStorage.getItem('sadae.mini.mute')==='1'; }catch(e){}
function sndUI(){ const b=document.getElementById('snd'); if(!b) return; b.textContent=MUTE?'🔇':'🔊'; b.classList.toggle('off',MUTE); b.setAttribute('aria-label',MUTE?'소리 켜기':'소리 끄기'); }
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('#snd'); if(!b) return; e.stopPropagation(); MUTE=!MUTE; try{ localStorage.setItem('sadae.mini.mute',MUTE?'1':'0'); }catch(err){} sndUI(); acOn(); },true);
setTimeout(sndUI,0);
/* 사대지기 = 츤데레 오리 (격언 좋아함). 격언 글은 앱 '오늘의 국궁 한마디'와 같은 글(관악정 국궁교본) 그대로, 앞뒤 잔소리만 사대지기 말투 */
const DW_SRC={j:'국궁교본 5.2 집궁제원칙', g:'국궁교본 2.3.3 궁도 9계훈', s:'국궁교본 6.5 심담 14요', b:'국궁교본 6.6 불가필중', t:'국궁교본 용어 풀이'};
const DAILY_WORDS=[
 ['j','先觀地形 後察風勢','선관지형 후찰풍세','먼저 지형을 관찰하고 나서 다음은 바람의 흐름을 살핀다.'],
 ['j','非丁非八 胸虛腹實','비정비팔 흉허복실','발의 위치는 丁 자도 八 자도 아니며, 가슴을 비우고 배를 든든히 한다.'],
 ['j','前推泰山 後握虎尾','전추태산 후악호미','줌손은 태산을 밀듯이 밀고, 깍지손은 호랑이 꼬리를 잡아당기듯 뒤로 당긴다.'],
 ['j','發而不中 反求諸己','발이부중 반구제기','활을 쏘아서 맞지 않으면 자신의 마음가짐과 자세를 다시 살핀다.'],
 ['g','仁愛德行','인애덕행','사랑과 덕행으로 본을 보인다.'],
 ['g','誠實謙遜','성실겸손','겸손하고 성실하게 행한다.'],
 ['g','自重節操','자중절조','신중하고 조심스럽게 행동하라.'],
 ['g','禮儀嚴守','예의엄수','예의 범절을 엄격히 지킨다.'],
 ['g','廉直果敢','염직과감','청렴 강직하고 용감하게 행한다.'],
 ['g','習射無言','습사무언','활을 쏠 때는 침묵을 지킨다.'],
 ['g','正心正己','정심정기','몸과 마음을 항상 바르게 한다.'],
 ['g','不怨勝者','불원승자','이긴 사람을 원망하지 않는다.'],
 ['g','莫彎他弓','막만타궁','남의 활을 함부로 당기지 않는다.'],
 ['s','弓要軟','궁요연','활은 자기 힘에 맞게 연해야 한다.'],
 ['s','箭要長','전요장','살은 적당히 길어야 한다.'],
 ['s','胸前宜吸','흉전의흡','가슴 앞은 안으로 거두어 들인다.'],
 ['s','脚立要方','각립요방','다리는 평온하면서도 굳건하게 선다.'],
 ['s','持弓如握卵','지궁여악란','활을 쥐는 것은 달걀을 잡듯이 한다.'],
 ['s','搭箭如懸衡','탑전여현형','화살 끼우기는 저울질하듯 한다.'],
 ['s','弓要梢側','궁요초측','활은 조금 기울인다.'],
 ['s','手要平衡','수요평형','양손은 평형을 이루어야 한다.'],
 ['s','前膀要轉','전방요전','앞팔 상반절은 틀어서 곧게 펴야 한다.'],
 ['s','筋骨要神','근골요신','근육과 뼈는 쭉 펴야 한다.'],
 ['s','前肩要藏','전견요장','앞어깨는 감추어야 한다.'],
 ['s','後肩要擠','후견요제','뒷어깨는 뒤로 밀치듯이 한다.'],
 ['s','出箭要輕','출전요경','화살을 낼 때는 가볍게 낸다.'],

 ['b','生弓 不可必中','생궁 불가필중','익지 않은 활은 적중할 수 없다.'],
 ['b','生疎 不可必中','생소 불가필중','생소한 활로는 적중할 수 없다.'],
 ['b','弓强矢輕 不可必中','궁강시경 불가필중','활은 강한데 살이 가벼우면 적중할 수 없다.'],
 ['b','弓弱矢重 不可必中','궁약시중 불가필중','활은 약한데 살이 무거우면 적중할 수 없다.'],
 ['b','氣驕志怠 不可必中','기교지태 불가필중','교만한 기와 뜻이 게으르면 적중할 수 없다.'],
 ['b','心身恍惚 不可必中','심신황홀 불가필중','심신이 흐리멍텅하면 적중할 수 없다.'],
 ['b','射多力疲 不可必中','사다역피 불가필중','많이 쏘아 피로하면 적중할 수 없다.'],
 ['b','見己之病不改 不可必中','견기지병불개 불가필중','자기 잘못을 알고도 고치지 않으면 적중할 수 없다.'],
 ['b','好勝之心甚 不可必中','호승지심심 불가필중','이기려는 마음이 심하면 적중할 수 없다.'],
 ['b','怯懦之心生 不可必中','겁나지심생 불가필중','겁먹고 나약한 마음이 들면 적중할 수 없다.'],
 ['t','몰기','','한 순(巡) 쏠 때 살 다섯 개가 다 맞는 것. 몰기를 하면 과녁에 대고 가볍게 목례한다.'],
 ['t','접장','','상대를 높여 주는 말. 원래는 첫 몰기를 하면 접장이라는 칭호를 붙여 준다.'],
 ['t','초순(初巡)','','처음 쏘는 한 순(巡).'],
 ['t','막순','종순(終巡)','마지막에 쏘는 한 순(巡).'],
 ['t','일획(一劃)','','관사 과녁에 10순(巡)을 쏘는 것. 즉 50시(矢)를 말한다.'],

 ['t','살고','','화살이 뜨는 높이.'],
 ['t','평찌','','화살이 평평하고 낮게 가는 것.'],

 ['t','뒤난다','','살이 과녁의 왼쪽으로 떨어지는 것. 줌손의 뒤쪽으로 떨어진다는 뜻.'],
 ['t','안바람','촉바람','과녁에서 사대로 부는 바람. 안고 쏜다는 뜻이다.'],
 ['t','오늬바람','','사대에서 과녁으로 부는 바람. 오늬의 뒤에서 부는 바람.'],
 ['t','월촉','몰촉','활을 너무 많이 당겨서 촉이 줌을 지나 쑥 들어오는 것.'],
 ['t','고자채기','','활을 쏠 때 발시하면서 윗고자가 과녁 쪽으로 기우는 것.'],
 ['t','궁체(弓體)','체집','활 쏘는 자세. 활의 생긴 모습을 이르기도 한다.'],
 ['t','사말','','활터에서 남에게 자신을 낮춰 부르는 말.'],
 ['t','구사(舊射)','','활을 오래 쏜 사람. 처음 활을 배우는 사람은 신사(新射)라 한다.'],
 ['t','무겁','개자리','과녁 앞에 웅덩이 등을 파고 사람이 들어앉아서 살의 적중 여부를 확인하는 장소.'],
 ['t','바탕','','화살이 가는 거리. 즉 사대(射臺)에서 과녁까지의 거리.'],

 ['t','중구미','','팔꿈치. 활잡은 어깨 부위는 죽머리라 한다.'],
];

function bgBuild(th){ const P=4, w=Math.ceil((W+40)/P), h=Math.ceil((H+40)/P); const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); const T=THEMES[th];

    else { x.fillStyle= T.deco==='night'?'#1A2E26' : T.deco==='dusk'?'#3E4A3A' : '#3F6B45'; x.fillRect(i,t-6,1,6); x.fillRect(i-1,t-4,3,3); x.fillRect(i-2,t-2,5,2); if(T.deco==='snow'){ x.fillStyle='#FFFFFF'; x.fillRect(i,t-6,1,1); x.fillRect(i-1,t-4,3,1); x.fillRect(i-2,t-2,5,1); } } }

function mix(a,b,t){ const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const A=p(a),B=p(b); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); }

  g.globalAlpha=1; }

/* 과녁 움직임 */
let pauseLeft=0, dashN=0;
function newPass(){ S.passT=5/6+Math.random()*(7/8-5/6); S.passGo=Math.random()<.35; }   // v1.7: 이번에 끝 직전에서 돌아설지·어디서
const WIND_K=[['약',.08],['중',.12],['강',.18]];
function moveTarget(dt){
  const L=lv(), ln=lane(); let v=L.speed*KS();
  v*= (S.vj||1);   // v1.7: 8중 확률 속도 변화
  if(S.wind) v*= 1 + S.dir*S.wind.d*WIND_K[S.wind.k][1];   // v1.7: 13~15시 바람 — 따라가면 빠르고 거스르면 느림
  if(L.wave) v*= .55+ .75*(.5+.5*Math.sin(S.t*2.4));
  if(S.focus>0) v*=.5;                                   // 집중: 과녁이 느려짐
  if(L.dash){ // 가운데에서 비켜난 두 자리(A·B)에 멈칫 → 반대편으로 빠르게
    const D=(ln.r-ln.l)*.3, A=W/2-D, B=W/2+D;
    if(pauseLeft>0){ pauseLeft-=dt; return; }
    S.tx+=S.dir*v*2.3*dt;
    if(S.dir>0 && S.tx>=B){ S.tx=B; S.dir=-1; pauseLeft= dashN++%2? .85 : .5; }
    if(S.dir<0 && S.tx<=A){ S.tx=A; S.dir=1; pauseLeft= dashN++%2? .85 : .5; }
    return; }
  if(S.streak>=8 && S.streak<12 && S.passGo && S.flipShot!==S.shot){   // v1.7: 8~11 끝 직전 돌아서기 (한 발에 1번)
    const w=ln.r-ln.l, q= S.dir>0? (S.tx-ln.l)/w : (ln.r-S.tx)/w;
    if(q>=S.passT){ S.dir*=-1; S.flipShot=S.shot; newPass(); return; } }
  S.tx+=S.dir*v*dt;
  if(S.tx>ln.r){ S.tx=ln.r; S.dir=-1; newPass(); } if(S.tx<ln.l){ S.tx=ln.l; S.dir=1; newPass(); }
}
/* 가림판: 과녁과 활 사이를 반대 방향으로 오감 */
const sY=()=> H*.5, SW=()=> W*.2;

   → 과녁(좌우 왕복)과 움직임·속도가 달라짐 */
const SCR_W=[['약',55],['중',95],['강',145]];
function scrWindNew(){ S.swDir=Math.random()<.5?-1:1; S.swLv=Math.floor(Math.random()*3); }
function moveScreen(dt){ const on=lv().screen; if(on && !S.scrWas){ scrWindNew(); const ln=lane(); S.sx = S.swDir>0? ln.l : ln.r; } S.scrWas=on; if(!on) return;
  const ln=lane(), w=SW(); S.sx += S.swDir*SCR_W[S.swLv||0][1]*KS()*(S.focus>0?.5:1)*dt;
  if(S.swDir>0 && S.sx>ln.r+w*.6) S.sx=ln.l-w*.6; if(S.swDir<0 && S.sx<ln.l-w*.6) S.sx=ln.r+w*.6; }

/* ── 쏘기 ── */
function fire(){
  if(S.phase==='title'||S.phase==='over') return;
  if(S.arrows.length) return;                  // 한 번에 한 발
  if(S.shot>=SHOTS) return;
  if(S.shot%5===0) S.sunH=0; S.shot++; sTwang(); buzz(18); S.recoil=1;
  S.arrows.push({t0:S.t, dur:lv().flight, scr:lv().screen});
}
/* 한 발 잃기: 목숨이 남으면 계속, 없으면 판 끝 */
function quip(t){ S.quip={t, at:S.t}; }
function loseLife(msg){ S.lives--; S.missN=(S.missN||0)+1; quip(S.lives<=1? '흥, 마지막 한 발이야. 집중!' : S.missN===1? '괜찮아, 다음 발.' : '숨 고르고.'); S.combo=0; S.perfect=0; S.aimT=S.t; S.lostT=S.t; S.sad=1; buzz(140);

  // 목숨 = 화살 (화살통)
  if(S.phase!=='title'){ const n=Math.max(S.lives||0, LIFE0); const lw=18+n*12; const lx=W/2-lw/2; g.fillStyle='rgba(255,255,255,.9)'; rr(lx,10,lw,34,17); g.fill();
    for(let i=0;i<n;i++){ const on=i<S.lives, x=lx+15+i*12, fl= !on && S.lostT && S.t-S.lostT<.6 && i===S.lives; g.globalAlpha= on?1:.2; if(fl) g.globalAlpha=.3+.7*Math.abs(Math.sin(S.t*20));
      g.strokeStyle='#3B2A1A'; g.lineWidth=2; g.beginPath(); g.moveTo(x,16); g.lineTo(x,38); g.stroke(); g.fillStyle='#555'; g.beginPath(); g.moveTo(x,13); g.lineTo(x-3.5,19); g.lineTo(x+3.5,19); g.fill(); g.fillStyle='#D2402F'; g.fillRect(x-4,31,3,8); g.fillRect(x+1,31,3,8); } g.globalAlpha=1; }
  const left= PRAC? BR.left() : MAXG-S.games.length - (S.phase==='play'||S.phase==='end'?1:0);
  g.fillStyle='rgba(255,255,255,.9)'; rr(W-86,10,76,34,17); g.fill(); g.fillStyle='#1B2433'; g.textAlign='right'; g.fillText(`남은 판 ${Math.max(0,left)}`,W-22,32);
  if(S.wind && (S.phase==='play'||S.phase==='end')){ g.fillStyle='rgba(20,30,45,.72)'; rr(10,76,104,22,11); g.fill(); g.fillStyle='#fff'; g.font='700 11px "Noto Sans KR"'; g.textAlign='center'; g.fillText(`🎯 과녁 바람 ${S.wind.d>0?'→':'←'} ${WIND_K[S.wind.k][0]}`,62,91); }
  // 사대지기 한마디 (오른쪽 위)
  if(S.quip && S.t-S.quip.at<2.2 && S.phase!=='title'){ const a=S.t-S.quip.at, al= a<.15? a/.15 : a>1.8? (2.2-a)/.4 : 1; g.globalAlpha=al;
    g.font='700 12px "Noto Sans KR"'; const tw=g.measureText(S.quip.t).width+18, bx=W-tw-48, by=52; g.fillStyle='#FFFFFF'; rr(bx,by,tw,26,8); g.fill(); g.strokeStyle='#1B2433'; g.lineWidth=1.5; rr(bx,by,tw,26,8); g.stroke();
    g.fillStyle='#1B2433'; g.textAlign='left'; g.fillText(S.quip.t,bx+9,by+17); if(kimg.complete) g.drawImage(kimg,W-46,by-8,38,46); g.globalAlpha=1; }
  // 관중 팝
  if(S.pop){ const a=(S.t-S.pop.t); if(a<1.1){ const s=a<.18? .5+a/.18*.7 : 1.2-Math.min(.2,(a-.18)); g.save(); g.globalAlpha=a>.8? 1-(a-.8)/.3 : 1; g.translate(W/2,H*.66); g.scale(s,s); g.textAlign='center';
    g.font='900 46px "Noto Serif KR"'; g.lineWidth=6; g.strokeStyle='#fff'; g.strokeText(S.pop.txt,0,0); g.fillStyle=S.pop.miss?'#1F3A5F':'#D2402F'; g.fillText(S.pop.txt,0,0);
    if(S.pop.sub){ g.font='700 13px "Noto Sans KR"'; g.strokeText(S.pop.sub,0,60); g.fillStyle='#1B2433'; g.fillText(S.pop.sub,0,60); g.fillStyle='#D2402F'; }
    if(S.pop.n>1){ g.font='400 26px "Do Hyeon"'; g.strokeText(S.pop.n+'연중',0,34); g.fillStyle='#1F3A5F'; g.fillText(S.pop.n+'연중',0,34); } g.restore(); } }
  // 배경 이름 (판 시작 때 잠깐)
  if(S.phase==='play' && S.thT!==undefined && S.t-S.thT<2){ const a=S.t-S.thT; g.globalAlpha= a>1.5? (2-a)/.5 : 1; g.fillStyle='rgba(0,0,0,.45)'; rr(W/2-70,H*.13,140,30,15); g.fill(); g.fillStyle='#fff'; g.font='700 14px "Noto Sans KR"'; g.textAlign='center'; g.fillText(THEMES[S.th].name,W/2,H*.13+20); g.globalAlpha=1; }
  // 단계 바뀜 알림
  const L=lv(); const msg = S.streak===3?'빨라져요!' : S.streak===6?'앞줄·뒷줄 번갈아!' : S.streak===9?'가림판 등장!' : S.streak===12?'멈칫했다 휙!' : '';
  if(msg && S.pop && S.t-S.pop.t<1.4 && S.t-S.pop.t>.5){ g.textAlign='center'; g.font='400 20px "Do Hyeon"'; g.fillStyle='#fff'; g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=4; g.strokeText(msg,W/2,H*.42); g.fillText(msg,W/2,H*.42); }
}
function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function ridge(base,amp,col,seed){ g.fillStyle=col; g.beginPath(); g.moveTo(-20,H); for(let x=-20;x<=W+20;x+=8){ g.lineTo(x, base-amp*(.55*Math.sin(x*.012+seed)+.3*Math.sin(x*.031+seed*2)+.15*Math.sin(x*.07+seed*3))); } g.lineTo(W+20,H); g.fill(); }
/* 국궁 과녁: 흰 테 · 남색 · 붉은 가운데 + 꽂힌 화살 */
function target(x,y,w){ const h=w*1.33; const wob=S.flash>0? Math.sin(S.t*70)*S.flash*3 : 0;
  g.save(); g.translate(x+wob,y);
  g.fillStyle='#5A4632'; g.fillRect(-w*.42,h*.2,4,h*.75); g.fillRect(w*.42-4,h*.2,4,h*.75);
  g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(-w/2+3,3,w,h);
  g.fillStyle='#F4F1EA'; g.fillRect(-w/2,0,w,h); g.fillStyle='#24384F'; g.fillRect(-w/2+w*.08,h*.06,w*.84,h*.88);
  g.fillStyle='#F4F1EA'; g.fillRect(-w/2+w*.2,h*.18,w*.6,h*.64); g.fillStyle='#24384F'; g.fillRect(-w/2+w*.28,h*.26,w*.44,h*.48);
  g.fillStyle='#D2402F'; g.fillRect(-w*.12,h*.38,w*.24,h*.24);
  // 꽂힌 화살 (Knife Hit처럼 쌓임)
  S.stuck.forEach(s=>{ const sx=s.ox*tScale(), sy=h*.5+s.oy; g.strokeStyle='#3B2A1A'; g.lineWidth=2; g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx+3,sy+w*.5); g.stroke(); g.fillStyle='#D2402F'; g.fillRect(sx+1,sy+w*.42,5,4); });
  g.restore(); }
function arrowUp(x,y,sc){ const L=120*sc; g.save(); g.translate(x,y); g.strokeStyle='#3B2A1A'; g.lineWidth=Math.max(1.5,4*sc); g.beginPath(); g.moveTo(0,0); g.lineTo(0,L); g.stroke();
  g.fillStyle='#444'; g.beginPath(); g.moveTo(0,-8*sc); g.lineTo(-5*sc,4*sc); g.lineTo(5*sc,4*sc); g.fill();
  g.fillStyle='#D2402F'; g.fillRect(-6*sc,L-18*sc,5*sc,16*sc); g.fillRect(1*sc,L-18*sc,5*sc,16*sc); g.restore(); }
/* 뒤에서 본 활: 쏘면 시위가 튕김 */
function bowBack(x,y){ const r=S.recoil||0; const ready=!S.arrows.length && S.phase==='play';
  g.strokeStyle='#6B3E1E'; g.lineWidth=6; g.lineCap='round'; g.beginPath(); g.moveTo(x-70,y+8); g.quadraticCurveTo(x-60,y-22,x-24,y-14); g.quadraticCurveTo(x,y-10,x+24,y-14); g.quadraticCurveTo(x+60,y-22,x+70,y+8); g.stroke();
  g.lineWidth=1.6; g.strokeStyle='#eee'; const pull= ready? 22 : -r*10*Math.cos(S.t*80); g.beginPath(); g.moveTo(x-70,y+8); g.lineTo(x,y+8+pull); g.lineTo(x+70,y+8); g.stroke(); g.lineCap='butt';
  if(ready){ arrowUp(x,y-60,.62); } }

/* ── 진행 ── */
function loop(now){
  const dt=Math.min(.05,(now-(S.lastNow||now))/1000); S.lastNow=now; S.t+=dt;
  if(S.phase==='play' || S.phase==='end'){ if(S.phase==='play'){ moveTarget(dt); moveScreen(dt); moveQuiver(dt); moveHive(dt); }
    S.arrows=S.arrows.filter(a=>{ if(S.phase==='play' && checkScreen(a)) return false; if(S.t-a.t0>=a.dur){ resolve(a); return false; } return true; });
    if(S.phase==='play' && !S.arrows.length) lateBoth();
    if(S.phase==='play' && !S.arrows.length && S.shot>=SHOTS){ S.endMsg='15발을 다 쐈어요'; S.phase='end'; S.endT=S.t; }
    if(S.phase==='play' && !S.arrows.length && S.t-S.aimT>AIM){ fire(); if(S.arrows[0]) S.arrows[0].auto=true; } }
  if(S.phase==='end' && S.t-S.endT>(S.bees?1.8:1.1)){ S.phase='over'; finish(); }
  { const Lg=LINE[S.phase==='play'||S.phase==='end'? lv().line : 'mid']; const k=Math.min(1,dt*6); S.ly=(S.ly||.31)+(Lg[0]-(S.ly||.31))*k; S.ls=(S.ls||1)+(Lg[1]-(S.ls||1))*k; }
  S.shake*=.88; if(S.shake<.3) S.shake=0; S.flash=Math.max(0,S.flash-dt*3); S.hop=Math.max(0,S.hop-dt*3); S.sad=Math.max(0,S.sad-dt*.6); S.recoil=Math.max(0,(S.recoil||0)-dt*5);
  S.fx.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=500*dt; p.life-=dt; }); S.fx=S.fx.filter(p=>p.life>0);
  if(S.phase==='title' && S.t>0) moveTarget(dt*.6);
  draw(); requestAnimationFrame(loop);
}
function start(){ if(S.games.length>=MAXG) return; if(BR && !BR.begin()) { if(PRAC) title(); return; } S.phase='play'; S.streak=0; S.stuck=[]; S.arrows=[]; S.pop=null; S.tx=lane().l; S.dir=1; pauseLeft=0; S.wind=null; S.windShot=-1; S.flipShot=-1; S.vj=1; newPass(); dashN=0; S.sx=lane().r; S.sdir=-1; S.focus=0; S.perfect=0; S.blocked=null; S.aimT=S.t; S.lives=LIFE0; S.combo=0; S.bestCombo=0; S.hive=null; S.bees=null; S.qCount=0; S.hCount=0; S.scr2=false; S.scrWas=false; S.both=false; S.forceScr=false; S.spawnN=0; S.missT=0; S.lostT=0; S.endMsg=''; S.shot=0; S.quiver=null; S.sunH=0; S.ly=.31; S.ls=1; S.mol=0; S.missN=0; S.quip=null; pickTheme(); { const c=document.getElementById('wordCard'); if(c) c.hidden=true; } $('#over').hidden=true; }
function finish(){ S.games.push(S.streak); if(BR) BR.end(S.streak,{mol:S.mol?1:0, combo:S.bestCombo||0});
  if(PRAC){ S.games=[]; showNag(S.mol? 'mol' : S.streak>=11? 'great' : S.streak<=5? 'bad' : 'mid'); const pl=BR.left(); const o=$('#over'); o.hidden=false;
    o.innerHTML=`<h2>연습 끝</h2><div class="n">15시 ${S.streak}중</div><p>${S.endMsg||''} · 최고 ${S.bestCombo||0}연중<br>오늘 연습 남은 <b>${pl}판</b> · 연습은 랭킹에 안 올라가요</p><button id="again" ${pl?'':'disabled'}>${pl?'한 판 더':'오늘 연습 끝'}</button>`;
    const b=$('#again'); if(pl) b.onclick=e=>{ e.stopPropagation(); start(); }; tag(); return; }
  render();
  showNag(S.mol? 'mol' : S.streak>=11? 'great' : S.streak<=5? 'bad' : 'mid');
  const left=MAXG-S.games.length; const tot=dayHits(), shot=S.games.length*15;
  const o=$('#over'); o.hidden=false;
  const head = left? `${S.games.length}판` : (tot>=22? danOf(tot)+' 합격!' : '아쉬워요');
  const body = left? `${S.streak===15?'만점!<br>':''}${S.endMsg||''} · 최고 ${S.bestCombo||0}연중<br>오늘 합 <b>${shot}시 ${tot}중</b> · 지금 ${danOf(tot)}${nextDan(tot)?'<br>'+nextDan(tot)+' 더 · 남은 판 '+left:''}`
                   : `<b>${danOf(tot)}</b>${tot===45?' · 만점!':''}${nextDan(tot)?'<br>'+nextDan(tot)+' 모자랐어요':''}<br>오늘 세 판을 다 했어요${BR&&BR.hint?'<br>'+BR.hint():' · 내일 또!'}`;
  o.innerHTML=`<h2>${head}</h2><div class="n">${left? '15시 '+S.streak+'중' : '45시 '+tot+'중'}</div><p>${body}</p><button id="again" ${left?'':'disabled'}>${left?'다음 판':'세 판 끝'}</button>`; tag();
  const b=$('#again'); if(left) b.onclick=e=>{ e.stopPropagation(); start(); }; }
function tag(){ const t=$('#modeTag'); if(!t||!BR) return; t.className='ex mode'+(PRAC?'':' rk'); t.textContent= PRAC? `연습 · 남은 ${BR.left()}판` : `🏆 랭킹 도전 · 남은 ${Math.max(0,3-S.games.length)}판`; }
function title(){ const o=$('#over'); o.hidden=false; tag();
  const L= BR? (PRAC? BR.left() : 3-S.games.length) : 1;
  const sub= !BR? '' : PRAC? `<p>연습 · 오늘 남은 <b>${L}판</b> · 기록은 안 남아요</p>` : `<p>🏆 랭킹 도전 · 오늘 남은 <b>${L}판</b> · 세 판 합계로 단</p>`;
  o.innerHTML=`<h2>관중의 제왕</h2>${keeperSayHTML('에헴. 과녁이 좀 움직여도 당황하지 말게.<br><b>올 자리를 보고 미리 톡!</b><br>쏠 땐 <b>습사무언(習射無言)</b>이야.')}${sub}<button id="go" ${L>0?'':'disabled'}>${L>0?'시작':(PRAC?'오늘 연습 끝':'오늘 도전 끝')}</button>`; if(L>0) $('#go').onclick=e=>{ e.stopPropagation(); start(); }; }

/* 기록 */
const SAMPLE=[{n:'궁사 C',j:'관악정',b:33},{n:'궁사 A',j:'관악정',b:28},{n:'궁사 B',j:'석호정',b:24},{n:'궁사 D',j:'황학정',b:19},{n:'궁사 E',j:'관악정',b:12}];
function render(){
  const tot=dayHits(), done=S.games.length===MAXG;
  $('#games').innerHTML=[0,1,2].map(i=>{ const v=S.games[i]; return `<div>${i+1}판<b>${v===undefined?'–':'15시 '+v+'중'}</b></div>`; }).join('')
    + `<div class="sum${done?' done':''}">오늘 합 <b>${S.games.length*15}시 ${tot}중</b> · ${danOf(tot)}${done?' 확정':''}${!done&&nextDan(tot)?' · '+nextDan(tot):''}</div>`;
}
$('#field').addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; e.preventDefault(); fire(); });
addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); if(!e.repeat) fire(); } });
const d=new Date(); $('#date').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 · 하루 3판`;
if(PRAC){ const c=$('#setCard'); if(c) c.hidden=true; }
addEventListener('resize',size); size(); S.tx=W/2; render(); title(); requestAnimationFrame(loop);
})();
